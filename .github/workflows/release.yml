name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CURRENT_VERSION=$(grep -E '^version\s*=' build.gradle.kts | sed -E 's/.*version\s*=\s*"([^"]+)".*/\1/')
            VERSION_TYPE="${{ github.event.inputs.version_type }}"
            
            IFS='.' read -r -a VERSION_PARTS <<< "$CURRENT_VERSION"
            MAJOR="${VERSION_PARTS[0]}"
            MINOR="${VERSION_PARTS[1]}"
            PATCH="${VERSION_PARTS[2]}"
            
            case "$VERSION_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
            
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
            echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Update version in build.gradle.kts
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" build.gradle.kts
          cat build.gradle.kts | grep version

      - name: Update version in plugin.xml
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/<version>.*<\/version>/<version>${VERSION}<\/version>/" src/main/resources/META-INF/plugin.xml
          cat src/main/resources/META-INF/plugin.xml | grep version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Get plugin filename
        id: plugin_file
        run: |
          PLUGIN_FILE=$(ls build/distributions/*.zip | head -n 1)
          PLUGIN_NAME=$(basename "$PLUGIN_FILE")
          echo "file=${PLUGIN_FILE}" >> $GITHUB_OUTPUT
          echo "name=${PLUGIN_NAME}" >> $GITHUB_OUTPUT
          echo "Plugin file: ${PLUGIN_NAME}"

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Lucid Chat Plugin ${{ steps.version.outputs.version }}
            
            ### Changes
            - Automated release build
            
            ### Installation
            1. Download the plugin ZIP file from assets
            2. In IntelliJ IDEA: File > Settings > Plugins
            3. Click ⚙️ > Install Plugin from Disk...
            4. Select the downloaded ZIP file
            5. Restart IntelliJ IDEA
            
            ### Plugin File
            - **File**: ${{ steps.plugin_file.outputs.name }}
            - **Version**: ${{ steps.version.outputs.version }}
          files: ${{ steps.plugin_file.outputs.file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release from Tag
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Lucid Chat Plugin ${{ steps.version.outputs.version }}
            
            ### Installation
            1. Download the plugin ZIP file from assets
            2. In IntelliJ IDEA: File > Settings > Plugins
            3. Click ⚙️ > Install Plugin from Disk...
            4. Select the downloaded ZIP file
            5. Restart IntelliJ IDEA
            
            ### Plugin File
            - **File**: ${{ steps.plugin_file.outputs.name }}
            - **Version**: ${{ steps.version.outputs.version }}
          files: ${{ steps.plugin_file.outputs.file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and tag version changes
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.version != ''
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add build.gradle.kts src/main/resources/META-INF/plugin.xml
          git commit -m "Bump version to ${{ steps.version.outputs.version }}" || exit 0
          git tag ${{ steps.version.outputs.tag }} || exit 0
          git push origin ${{ github.ref_name }} || exit 0
          git push origin ${{ steps.version.outputs.tag }} || exit 0
